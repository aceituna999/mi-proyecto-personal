<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sueño</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">😴 SUEÑO</div><h1>Rutina nocturna</h1><p>Objetivo: 7.5–8 horas</p></div></header><main class="container"><section class="card"><h2>🎯 Horario objetivo</h2><div class="stats-grid"><div class="stat"><span>🛏️ Dormir</span><b>10:30 pm</b></div><div class="stat"><span>⏰ Despertar</span><b>6:00 am</b></div></div></section><section class="card"><h2>🌙 Checklist</h2><div id="sleepHabits"></div></section><section class="card"><h2>📊 Registrar sueño</h2><label class="label">¿Cuántas horas dormiste?</label><div class="row"><input id="sleepHours" class="input" type="number" step="0.5" min="0" max="14" placeholder="Ej. 7.5"><button class="btn" onclick="saveSleep()">Guardar</button></div></section><section class="card"><p style="color:var(--muted);font-size:12px;line-height:1.5">Si actualmente duermes a medianoche, adelanta gradualmente la hora de dormir en lugar de cambiarla de golpe.</p></section></main><nav class="bottom-nav"><a href="index.html">🏠<span>Inicio</span></a><a href="alimentacion.html">🥗<span>Plan</span></a><a href="ejercicio.html">🏋️<span>Entreno</span></a><a href="progreso.html">📊<span>Progreso</span></a><a class="active" href="sueno.html">😴<span>Sueño</span></a></nav><script src="app.js"></script><script>
function renderSleep(){const d=getData(),box=document.getElementById("sleepHabits");box.innerHTML="";[["night","Reducir pantallas 30–60 min antes"],["sleep","Prepararme para dormir a las 10:30"]].forEach(([id,n])=>{const x=document.createElement("div");x.className="habit"+(d.habits[id]?" done":"");x.innerHTML=`<div class="check"></div><span class="habit-name">${n}</span>`;x.onclick=()=>{d.habits[id]=!d.habits[id];saveData(d);renderSleep()};box.appendChild(x)});if(d.sleep)document.getElementById("sleepHours").value=d.sleep}function saveSleep(){const d=getData();d.sleep=Number(document.getElementById("sleepHours").value)||null;saveData(d);alert("Sueño registrado ✓")}renderSleep();
</script></body></html>
