<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progreso</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">📊 PROGRESO</div><h1>Tu evolución</h1><p>Peso · cintura · consistencia</p></div></header><main class="container"><section class="card"><h2>⚖️ Registrar medición</h2><div class="field"><label class="label">Peso (kg)</label><input id="weight" class="input" type="number" step="0.1" placeholder="89.0"></div><div class="field"><label class="label">Cintura (cm)</label><input id="waist" class="input" type="number" step="0.1" placeholder="Opcional"></div><button class="btn" onclick="saveMeasurement()">Guardar medición</button></section><section class="card"><div class="section-title"><h2>📈 Historial</h2><span id="count"></span></div><div id="history"></div></section><section class="card"><h2>🎯 Qué buscamos</h2><p style="color:var(--muted);font-size:13px;line-height:1.55">La tendencia del peso y la cintura debería disminuir progresivamente. También observaremos tu rendimiento para comprobar que el entrenamiento avanza.</p></section></main><nav class="bottom-nav"><a href="index.html">🏠<span>Inicio</span></a><a href="alimentacion.html">🥗<span>Plan</span></a><a href="ejercicio.html">🏋️<span>Entreno</span></a><a class="active" href="progreso.html">📊<span>Progreso</span></a><a href="sueno.html">😴<span>Sueño</span></a></nav><script src="app.js"></script><script>
function renderProgress(){const d=getData(),h=document.getElementById("history");document.getElementById("count").textContent=(d.weightLog||[]).length+" registros";h.innerHTML="";if(!d.weightLog?.length){h.innerHTML='<div class="empty">Aún no hay mediciones. Registra la primera.</div>';return}d.weightLog.slice().reverse().forEach(x=>{const e=document.createElement("div");e.className="option";e.innerHTML=`<b>${x.date}</b><p>⚖️ ${x.weight.toFixed(1)} kg ${x.waist?` · 📏 ${x.waist.toFixed(1)} cm`:""}</p>`;h.appendChild(e)})}function saveMeasurement(){const d=getData(),w=Number(document.getElementById("weight").value),wa=Number(document.getElementById("waist").value)||null;if(!w)return alert("Ingresa tu peso.");d.weight=w;if(wa)d.waist=wa;d.weightLog=d.weightLog||[];d.weightLog.push({date:new Date().toLocaleDateString("es-PE"),weight:w,waist:wa});saveData(d);alert("Medición guardada ✓");renderProgress()}renderProgress();
</script></body></html>
