<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidratación</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">💧 HIDRATACIÓN</div><h1>Agua diaria</h1><p>Meta orientativa: 2.5–3.0 L</p></div></header><main class="container"><section class="card"><div class="hero-head"><span>💧 Progreso</span><strong id="liters">0.0 L</strong></div><div class="progress"><span id="waterBar"></span></div><p id="waterPct" style="color:var(--muted);font-size:12px"></p><div class="row"><button class="btn" onclick="addWater(.25)">+250 ml</button><button class="btn" onclick="addWater(.5)">+500 ml</button><button class="btn secondary" onclick="addWater(-.25)">−250 ml</button></div></section><section class="card"><h2>🕐 Distribución sugerida</h2><div class="option"><p>🌅 Al despertar · 400 ml</p></div><div class="option"><p>🏋️ Después del ejercicio · 400 ml</p></div><div class="option"><p>💼 Durante el trabajo · 800 ml</p></div><div class="option"><p>🍛 Almuerzo · 400 ml</p></div><div class="option"><p>🌆 Tarde · 400 ml</p></div><div class="option"><p>🌙 Cena · 300 ml</p></div></section></main><nav class="bottom-nav"><a href="index.html">🏠<span>Inicio</span></a><a href="alimentacion.html">🥗<span>Plan</span></a><a href="ejercicio.html">🏋️<span>Entreno</span></a><a href="progreso.html">📊<span>Progreso</span></a><a href="sueno.html">😴<span>Sueño</span></a></nav><script src="app.js"></script><script>
function renderWater(){const d=getData();d.water=Math.max(0,Math.min(5,Number(d.water)||0));saveData(d);document.getElementById("liters").textContent=d.water.toFixed(1)+" L";const p=Math.min(100,d.water/3*100);document.getElementById("waterBar").style.width=p+"%";document.getElementById("waterPct").textContent=`${Math.round(p)}% de la meta de 3.0 L`;}function addWater(x){const d=getData();d.water=Math.max(0,Math.min(5,(d.water||0)+x));d.habits.water=d.water>=3;saveData(d);renderWater()}renderWater();
</script></body></html>
