<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenamiento</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">🏋️ ENTRENAMIENTO</div><h1 id="dayTitle">Rutina</h1><p>30 minutos · sin equipamiento</p></div></header><main class="container"><section class="card"><div class="day-title" id="focus"></div><div id="exerciseList"></div><button class="btn" style="width:100%;margin-top:14px" onclick="completeWorkout()">✓ Completar entrenamiento</button></section><section class="card"><h2>📅 Semana</h2><p style="color:var(--muted);font-size:13px;line-height:1.6">Lun: tren superior + abdomen<br>Mar: piernas + glúteos<br>Mié: espalda + postura + abdomen<br>Jue: tren superior + abdomen<br>Vie: piernas + glúteos<br>Sáb: cardio + movilidad<br>Dom: descanso</p></section></main><nav class="bottom-nav"><a href="index.html">🏠<span>Inicio</span></a><a href="alimentacion.html">🥗<span>Plan</span></a><a class="active" href="ejercicio.html">🏋️<span>Entreno</span></a><a href="progreso.html">📊<span>Progreso</span></a><a href="sueno.html">😴<span>Sueño</span></a></nav>
<script src="app.js"></script><script>
const routines={
1:["Tren superior + abdomen",[["Flexiones","3 × 8–12"],["Flexiones inclinadas","2 × 10–15"],["Pike push-up","2 × 6–10"],["Plancha","3 × 25–40 s"]]],
2:["Piernas + glúteos",[["Sentadillas","3 × 12–15"],["Puente de glúteos","3 × 15–20"],["Zancadas","3 × 8–10 por pierna"],["Sentadilla isométrica","2 × 20–40 s"]]],
3:["Espalda + postura + abdomen",[["Superman","3 × 10–15"],["Y-T-W en el suelo","2 × 6 cada posición"],["Bird dog","3 × 8 por lado"],["Dead bug","3 × 8 por lado"]]],
4:["Tren superior + abdomen",[["Flexiones","3 × 8–12"],["Flexiones cerradas","2 × 6–10"],["Pike push-up","2 × 6–10"],["Plancha lateral","2 × 20–30 s por lado"]]],
5:["Piernas + glúteos",[["Sentadilla","3 × 12–15"],["Hip thrust en cama/suelo","3 × 12–15"],["Zancada atrás","3 × 8–10 por pierna"],["Puente de glúteo unilateral","2 × 8–10 por lado"]]],
6:["Cardio + movilidad",[["Marcha/trote en sitio","8 min"],["Jumping jacks","4 × 40 s"],["Mountain climbers","3 × 30 s"],["Movilidad de cadera/hombros","8 min"]]],
0:["Descanso",[["Recuperación","Paseo suave y movilidad opcional"]]]
};
function loadRoutine(){const day=new Date().getDay(),r=routines[day];document.getElementById("dayTitle").textContent=r[0];document.getElementById("focus").textContent=day===0?"DESCANSO PROGRAMADO":"30 MIN · "+r[0].toUpperCase();const box=document.getElementById("exerciseList");box.innerHTML="";r[1].forEach((x,i)=>{const div=document.createElement("div");div.className="exercise";div.innerHTML=`<div><b>${x[0]}</b><small>${x[1]}</small></div><div class="mini-check" id="ex${i}" onclick="event.stopPropagation();this.classList.toggle('done')"></div>`;box.appendChild(div)});if(day===0)document.querySelector(".btn").style.display="none"}function completeWorkout(){const d=getData();d.habits.workout=true;saveData(d);alert("Entrenamiento registrado ✓");}loadRoutine();
</script></body></html>
